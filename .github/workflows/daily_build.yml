name: Daily Pipeline Run
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pipeline: [src/longform_pipeline.py, src/shortform_pipeline.py]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Prep Config
        run: |
          cp config.template.yaml config.yaml
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}' | base64 -d > token.pickle
      - name: Run Pipeline
        env:
          # Assuming config_loader handles these via os.getenv
          API_KEYS: ${{ secrets.API_KEYS }} 
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python ${{ matrix.pipeline }}
